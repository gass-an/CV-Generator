name: Intégration continue

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  backend:
    name: Vérifier le backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: generator-service
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: generator-service/pyproject.toml

      - name: Installer les dépendances du backend
        run: python -m pip install -e '.[dev]'

      - name: Vérifier le formatage
        run: ruff format --check .

      - name: Analyser le code
        run: ruff check .

      - name: Exécuter les tests
        run: pytest

  docker:
    name: Construire l'image Docker
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Construire l'image de production
        run: >-
          docker build
          -f generator-service/Dockerfile
          -t cv-generator:test
          generator-service
