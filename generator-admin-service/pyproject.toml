[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cv-generator-admin-service"
version = "0.3.0"
description = "Interface privée d'administration de CV-Generator"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "argon2-cffi>=23.1,<26.0",
    "asyncpg>=0.30,<1.0",
    "cv-generator-shared>=0.1.0,<1.0.0",
    "fastapi>=0.115,<1.0",
    "jinja2>=3.1,<4.0",
    "pydantic-settings>=2.5,<3.0",
    "python-multipart>=0.0.9,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.7,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
