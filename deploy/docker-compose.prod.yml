name: cv-generator

services:
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda13
    container_name: cv-llm

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    environment:
      LLAMA_CACHE: /models

    volumes:
      - llm-models:/models

    ports:
      - "127.0.0.1:8080:8080"

    command:
      - "-hf"
      - "${LLM_MODEL}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--ctx-size"
      - "${LLM_CTX_SIZE}"
      - "--n-gpu-layers"
      - "99"

    restart: unless-stopped

volumes:
  llm-models:
    name: cv-generator-models