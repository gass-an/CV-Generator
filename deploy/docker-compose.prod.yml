name: cv-generator

x-generator-environment: &generator-environment
  APP_VERSION: ${APP_VERSION:?APP_VERSION est obligatoire}
  APP_ENV: production
  LOG_LEVEL: ${LOG_LEVEL}
  DATABASE_URL: ${DATABASE_URL}
  OPT_AVP_BASE_URL: ${OPT_AVP_BASE_URL}
  # En production le worker utilise toujours le Router du réseau Docker.
  LLM_BASE_URL: http://llm:8080
  LLM_MODEL: ${LLM_MODEL:-ggml-org/Qwen3-14B-GGUF:Q4_K_M}
  # Inclut le chargement initial du modèle par le Router après un redémarrage.
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-600}
  WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS}
  WORKER_STALE_JOB_TIMEOUT_SECONDS: ${WORKER_STALE_JOB_TIMEOUT_SECONDS}
  LIBREOFFICE_EXECUTABLE: ${LIBREOFFICE_EXECUTABLE:-libreoffice}
  PDF_CONVERSION_TIMEOUT_SECONDS: ${PDF_CONVERSION_TIMEOUT_SECONDS:-60}
  PDF_CONVERSION_MAX_CONCURRENT: ${PDF_CONVERSION_MAX_CONCURRENT:-2}

services:
  postgres:
    image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks: [application]

  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b11889@sha256:b51c252687249a6990ae1c168156cb215c954bfd71f9c434eda9a065b1a40dbe
    container_name: cv-llm

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    environment:
      LLAMA_CACHE: /models

    volumes:
      - llm-models:/models

    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--ctx-size"
      - "${LLM_CTX_SIZE:-8192}"
      - "--n-gpu-layers"
      - "99"
      - "--models-max"
      - "1"
      - "--sleep-idle-seconds"
      - "${LLM_SLEEP_IDLE_SECONDS:-900}"

    restart: unless-stopped
    networks: [llm-control]

  generator-migrate:
    image: ghcr.io/gass-an/cv-generator:${APP_VERSION}
    environment: *generator-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [application]

  generator-api:
    image: ghcr.io/gass-an/cv-generator:${APP_VERSION}
    environment: *generator-environment
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      generator-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [application]

  generator-worker:
    image: ghcr.io/gass-an/cv-generator:${APP_VERSION}
    environment: *generator-environment
    command: ["python", "-m", "app.workers.document_worker"]
    depends_on:
      generator-migrate:
        condition: service_completed_successfully
      llm:
        condition: service_started
    restart: unless-stopped
    networks: [application, llm-control]

  generator-admin:
    image: ghcr.io/gass-an/cv-generator-admin:${APP_VERSION}
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Renseignez ADMIN_USERNAME dans deploy/.env}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Renseignez ADMIN_PASSWORD_HASH dans deploy/.env}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?Renseignez ADMIN_SESSION_SECRET dans deploy/.env}
      ADMIN_SESSION_TTL_SECONDS: ${ADMIN_SESSION_TTL_SECONDS:-3600}
      ADMIN_SESSION_COOKIE_NAME: ${ADMIN_SESSION_COOKIE_NAME:-cv_generator_admin_session}
      ADMIN_CSRF_COOKIE_NAME: ${ADMIN_CSRF_COOKIE_NAME:-cv_generator_admin_csrf}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-true}
      ADMIN_BASE_URL: ${ADMIN_BASE_URL:?Renseignez l URL HTTPS ADMIN_BASE_URL dans deploy/.env}
      ADMIN_TIMEZONE: ${ADMIN_TIMEZONE:-Pacific/Noumea}
      ADMIN_LOGIN_WINDOW_SECONDS: ${ADMIN_LOGIN_WINDOW_SECONDS:-900}
      ADMIN_LOGIN_MAX_ATTEMPTS: ${ADMIN_LOGIN_MAX_ATTEMPTS:-5}
      ADMIN_TRUSTED_PROXY_IPS: ${ADMIN_TRUSTED_PROXY_IPS:-}
      LLM_BASE_URL: http://llm:8080
      LLM_MODEL: ${LLM_MODEL:-ggml-org/Qwen3-14B-GGUF:Q4_K_M}
      LLM_MANAGEMENT_ENABLED: "true"
      LLM_MANAGEMENT_TIMEOUT_SECONDS: ${LLM_MANAGEMENT_TIMEOUT_SECONDS:-30}
      LLM_ACTIVATION_TIMEOUT_SECONDS: ${LLM_ACTIVATION_TIMEOUT_SECONDS:-600}
      LLM_CACHE_PATH: /models
      LLM_CONTEXT_SIZE: ${LLM_CTX_SIZE:-8192}
      LLM_GPU_LAYERS: 99
    volumes:
      - llm-models:/models:ro
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      generator-migrate:
        condition: service_completed_successfully
      llm:
        condition: service_started
    restart: unless-stopped
    networks: [application, llm-control]

  generator-web:
    image: ghcr.io/gass-an/cv-generator-web:${APP_VERSION}
    ports:
      - "127.0.0.1:${WEB_PORT:-8082}:80"
    restart: unless-stopped
    networks: [application]

networks:
  application:
  llm-control:

volumes:
  llm-models:
    name: cv-generator-models
  postgres-data:
    name: cv-generator_postgres-data
