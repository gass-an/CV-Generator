server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 3m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; frame-src 'self' blob:; img-src 'self' data: blob:; object-src 'self' blob:; script-src 'self'; style-src 'self' 'unsafe-inline'" always;

    location /api/v1/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $generator_api http://generator-api:8000;
        proxy_pass $generator_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 95s;
        proxy_read_timeout 95s;
        proxy_buffering off;
        proxy_no_cache 1;
        add_header Cache-Control "private, no-store" always;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
