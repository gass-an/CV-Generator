name: Publication

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/gass-an/cv-generator

jobs:
  release:
    name: Publier la version
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: generator-service/pyproject.toml

      - name: Installer les dépendances du backend
        working-directory: generator-service
        run: python -m pip install -e '.[dev]'

      - name: Vérifier le formatage
        working-directory: generator-service
        run: ruff format --check .

      - name: Analyser le code
        working-directory: generator-service
        run: ruff check .

      - name: Exécuter les tests
        working-directory: generator-service
        run: pytest

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Se connecter à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Générer les métadonnées de l'image
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest

      - name: Construire et publier l'image de production
        uses: docker/build-push-action@v6
        with:
          context: generator-service
          file: generator-service/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

      - name: Créer la version GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
