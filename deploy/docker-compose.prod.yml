name: cv-generator

x-generator-environment: &generator-environment
  APP_ENV: production
  LOG_LEVEL: ${LOG_LEVEL}
  DATABASE_URL: ${DATABASE_URL}
  OPT_AVP_BASE_URL: ${OPT_AVP_BASE_URL}
  LLM_BASE_URL: http://llm:8080
  LLM_MODEL: ${LLM_MODEL}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS}
  WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS}
  WORKER_STALE_JOB_TIMEOUT_SECONDS: ${WORKER_STALE_JOB_TIMEOUT_SECONDS}

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda13
    container_name: cv-llm

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    environment:
      LLAMA_CACHE: /models

    volumes:
      - llm-models:/models

    ports:
      - "127.0.0.1:8080:8080"

    command:
      - "-hf"
      - "${LLM_MODEL}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--ctx-size"
      - "${LLM_CTX_SIZE}"
      - "--n-gpu-layers"
      - "99"

    restart: unless-stopped

  generator-migrate:
    image: ghcr.io/gass-an/cv-generator:${APP_VERSION}
    environment: *generator-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  generator-api:
    image: ghcr.io/gass-an/cv-generator:${APP_VERSION}
    environment: *generator-environment
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      generator-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  generator-worker:
    image: ghcr.io/gass-an/cv-generator:${APP_VERSION}
    environment: *generator-environment
    command: ["python", "-m", "app.workers.document_worker"]
    depends_on:
      generator-migrate:
        condition: service_completed_successfully
      llm:
        condition: service_started
    restart: unless-stopped

volumes:
  llm-models:
    name: cv-generator-models
  postgres-data:
